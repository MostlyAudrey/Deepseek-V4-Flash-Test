{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card horse-card">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="hero-icon">🐴</div>
                    <h2 class="brand">Welcome Back</h2>
                    <p class="text-muted">Find your perfect pasture partner</p>
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control form-control-lg" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control form-control-lg" required>
                    </div>
                    <button type="submit" class="btn btn-horse w-100 mb-3">Saddle Up</button>
                </form>

                <div class="text-center mb-3">
                    <span class="text-muted">or</span>
                </div>

                <a href="{{ url_for('auth.google_login') }}" class="btn btn-outline-dark w-100 mb-3">
                    <img src="https://www.google.com/favicon.ico" width="20" alt=""> Sign in with Google
                </a>

                <p class="text-center mt-3">
                    New around the stable?
                    <a href="{{ url_for('auth.register') }}" class="text-decoration-none" style="color:#8B4513;font-weight:700;">
                        Register Here
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
