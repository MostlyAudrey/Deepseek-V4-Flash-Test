{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card horse-card">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="hero-icon">🦄</div>
                    <h2 class="brand">Join the Herd</h2>
                    <p class="text-muted">Create your account to find your perfect match</p>
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control form-control-lg" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control form-control-lg" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control form-control-lg" minlength="8" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control form-control-lg" required>
                    </div>
                    <button type="submit" class="btn btn-horse w-100 mb-3">Register</button>
                </form>

                <p class="text-center mt-3">
                    Already have a stable?
                    <a href="{{ url_for('auth.login') }}" class="text-decoration-none" style="color:#8B4513;font-weight:700;">
                        Sign In
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
